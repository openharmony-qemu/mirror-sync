name: Synchronize mirrors
on:
  schedule:
    - cron: '23 19 * * *'
  workflow_dispatch:
    inputs:
      repositories:
        description: 'Optional comma-separated enabled repository names; empty means all'
        type: string
        required: false
      prepare_only:
        description: 'Fetch and verify all upstream branches without publishing (migration diagnostics)'
        type: boolean
        default: false
      runner:
        description: 'Standard Ubuntu runner image'
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-24.04-arm
        default: ubuntu-24.04

permissions:
  contents: read

jobs:
  plan:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test synchronization safety
        run: python3 -m unittest discover -s tests -v
      - id: plan
        env:
          SELECT_REPOSITORIES: ${{ inputs.repositories }}
        run: python3 scripts/plan.py
  synchronize:
    needs: plan
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 350
    concurrency:
      group: mirror-sync-${{ matrix.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify synchronization authorization is configured
        if: ${{ !inputs.prepare_only }}
        env:
          APP_ID: ${{ vars.MIRROR_APP_ID }}
          APP_KEY: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          if [[ -z "$MIRROR_TOKEN" && ( -z "$APP_ID" || -z "$APP_KEY" ) ]]; then
            echo 'Configure MIRROR_APP_ID + MIRROR_APP_PRIVATE_KEY, or MIRROR_TOKEN, in mirror-sync.'
            exit 1
          fi
      - name: Fetch all upstream branches and prepare large-file history
        env:
          MIRROR_REPOSITORY: ${{ matrix.repository }}
        run: python3 scripts/sync.py --repository "$MIRROR_REPOSITORY" --work "$RUNNER_TEMP/mirrors" --phase prepare
      - name: Publish branches and report conflicts
        if: ${{ !inputs.prepare_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_APP_ID: ${{ vars.MIRROR_APP_ID }}
          MIRROR_APP_PRIVATE_KEY: ${{ secrets.MIRROR_APP_PRIVATE_KEY }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          MIRROR_REPOSITORY: ${{ matrix.repository }}
        run: python3 scripts/sync.py --repository "$MIRROR_REPOSITORY" --work "$RUNNER_TEMP/mirrors" --phase publish
      - name: Revoke the current installation token
        if: ${{ always() && !inputs.prepare_only }}
        env:
          MIRROR_REPOSITORY: ${{ matrix.repository }}
        run: python3 scripts/github_credentials.py revoke
      - name: Record source-only diagnostic scope
        if: inputs.prepare_only
        run: echo 'Source preparation only. No destination branches were published or verified.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mirror-evidence-${{ matrix.repository }}-attempt-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: warn
          retention-days: 90
